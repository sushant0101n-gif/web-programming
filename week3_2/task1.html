<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    position: relative;
    margin: 40px;
    padding: 16px;
    box-sizing: border-box;
  }

  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .card h2 {
    margin-top: 10px;
    margin-bottom: 8px;
  }

  .card p {
    margin: 6px 0;
  }

  .price {
    font-size: 18px;
    font-weight: bold;
    color: #0f766e;
  }

  .button {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 12px;
    background: #0f766e;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="card">
    <span class="badge">SALE</span>

    <h2>Wireless Headphones</h2>
    <p>Enjoy clear sound and comfortable listening.</p>
    <p class="price">$39.99</p>
    <a href="#" class="button">Shop Now</a>
  </div>

</body>
</html>
